<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LINA HOUSE - Pointe-Noire</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-white text-black">
<header class="flex justify-between items-center p-6 border-b sticky top-0 bg-white z-20">
<h1 class="font-black text-xl tracking-tight">LINA HOUSE</h1>
<button onclick="document.getElementById('cart').classList.remove('hidden')" class="text-xs border px-3 py-1">PANIER (<span id="count">0</span>)</button>
</header>

<div class="bg-black text-white text-center py-2 text-[10px] tracking-widest">LIVRAISON 24H POINTE-NOIRE • TIÉ-TIÉ | MVOUMVOU | CENTRE-VILLE</div>

<div id="grid" class="grid grid-cols-1 md:grid-cols-3 gap-0"></div>

<!-- MODAL DÉTAILS + PRIX -->
<div id="modal" class="fixed inset-0 hidden z-50">
<div class="absolute inset-0 bg-black/70" onclick="document.getElementById('modal').classList.add('hidden')"></div>
<div id="m-box" class="absolute right-0 top-0 h-full w-[95%] max-w-[420px] bg-white p-6 overflow-auto"></div>
</div>

<!-- PANIER -->
<div id="cart" class="fixed inset-0 hidden z-50">
<div class="absolute inset-0 bg-black/70" onclick="document.getElementById('cart').classList.add('hidden')"></div>
<div class="absolute right-0 top-0 h-full w-[95%] max-w-[380px] bg-white p-6 flex flex-col">
<h3 class="font-black">VOTRE PANIER</h3>
<div id="c-items" class="mt-6 space-y-4 flex-1"></div>
<div class="border-t pt-4">
<div class="flex justify-between font-black text-lg"><span>TOTAL</span><span id="c-total">0 F</span></div>
<button onclick="cmd()" class="w-full bg-black text-white py-4 mt-4 text-xs font-bold tracking-widest">COMMANDER SUR WHATSAPP</button>
</div>
</div>
</div>

<script>
const produits=[
{id:1,nom:"MARQUE 241 - 25ml",prix:8000,img:"marque-241.jpg",cat:"PARFUM HOMME",desc:"Senteur Invictus 25ml. Format voyage, tenue 24h. Idéal cadeau. Stock limité à Pointe-Noire."},
{id:2,nom:"SAC BORDEAUX PREMIUM",prix:22000,img:"sac-rouge.jpg",cat:"SAC À MAIN",desc:"Cuir grainé bordeaux, finition luxe style Polène/Zara. Bandoulière réglable incluse. Élégant pour bureau et soirée."},
{id:3,nom:"BAD LAD - MAUVAIS GARÇON",prix:15000,img:"bad-lad.jpg",cat:"PARFUM HOMME 100ml",desc:"Eau de Parfum 100ml homme. Boisé intense, flacon noir mat luxe avec éclair argenté. Signature masculine."}
];
let panier=[];
function render(){
let h=''; produits.forEach(p=>{
h+=`<div class="border-b border-r group">
<img src="${p.img}" onerror="this.src='https://via.placeholder.com/400x500?text=${p.nom}'" class="w-full h-[420px] object-contain bg-[#f7f7f7] p-6 group-hover:scale-105 transition">
<div class="p-4">
<p class="text-[10px] opacity-40 tracking-widest">${p.cat}</p>
<p class="font-bold text-sm mt-1 leading-tight">${p.nom}</p>
<div class="flex justify-between items-center mt-3">
<span class="font-black">${p.prix.toLocaleString()} F</span>
<button onclick="openM(${p.id})" class="border border-black px-3 py-1.5 text-[10px] font-bold hover:bg-black hover:text-white">DÉTAILS + PRIX</button>
</div>
<button onclick="add(${p.id})" class="w-full bg-black text-white py-3 mt-3 text-[11px] font-bold tracking-widest">AJOUTER AU PANIER</button>
</div>
</div>`;
});
document.getElementById('grid').innerHTML=h;
}
render();
function openM(id){
let p=produits.find(x=>x.id==id);
document.getElementById('m-box').innerHTML=`
<button onclick="document.getElementById('modal').classList.add('hidden')" class="text-xs">← RETOUR BOUTIQUE</button>
<img src="${p.img}" class="w-full h-[400px] object-contain bg-[#f7f7f7] mt-4 p-4">
<p class="text-[10px] tracking-widest opacity-40 mt-6">${p.cat}</p>
<h2 class="font-black text-2xl mt-1 leading-tight">${p.nom}</h2>
<p class="font-black text-xl mt-3">${p.prix.toLocaleString()} FCFA</p>
<p class="text-sm opacity-70 mt-4 leading-relaxed">${p.desc}</p>
<div class="bg-[#f7f7f7] p-3 mt-6 text-[11px]">✓ Livraison 24h Pointe-Noire<br>✓ Paiement à la livraison<br>✓ Stock limité</div>
<button onclick="add(${p.id});document.getElementById('modal').classList.add('hidden')" class="w-full bg-black text-white py-4 mt-6 text-xs font-bold tracking-widest">AJOUTER - ${p.prix.toLocaleString()} F</button>
<a href="https://wa.me/242069548949?text=Bonjour LINA HOUSE, je veux ${p.nom} à ${p.prix}F" target="_blank" class="block text-center w-full border border-black py-4 mt-2 text-xs font-bold">WHATSAPP DIRECT</a>
`;
document.getElementById('modal').classList.remove('hidden');
}
function add(id){
let p=produits.find(x=>x.id==id);let e=panier.find(x=>x.id==id);if(e)e.qte++;else panier.push({...p,qte:1});upd();document.getElementById('cart').classList.remove('hidden');
}
function upd(){
document.getElementById('count').innerText=panier.reduce((s,x)=>s+x.qte,0);
let t=0,c=document.getElementById('c-items');c.innerHTML='';
panier.forEach(i=>{t+=i.prix*i.qte;c.innerHTML+=`<div class="flex gap-3"><img src="${i.img}" class="w-16 h-20 object-contain bg-[#f7f7f7]"><div class="flex-1"><p class="text-xs font-bold leading-tight">${i.nom}</p><p class="text-xs mt-1">${i.prix}F x${i.qte}</p><button onclick="remove(${i.id})" class="text-[10px] underline opacity-50 mt-1">Retirer</button></div></div>`});
document.getElementById('c-total').innerText=t.toLocaleString()+' F';
}
function remove(id){panier=panier.filter(x=>x.id!=id);upd();}
function cmd(){
if(!panier.length)return alert('Panier vide');
let m="Salut LINA HOUSE 👋 Je commande:%0A%0A";panier.forEach(i=>m+=`- ${i.nom} | ${i.prix}F x${i.qte} = ${i.prix*i.qte}F%0A`);m+=`%0ATOTAL: ${panier.reduce((s,x)=>s+x.prix*x.qte,0)}F%0A%0ALivraison Pointe-Noire`;window.open(`https://wa.me/242069548949?text=${m}`,'_blank');
}
</script>
</body>
</html>
