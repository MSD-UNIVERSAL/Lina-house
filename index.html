<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINA'S HOUSE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:Arial,sans-serif;padding-bottom:90px}
.hero img{width:100%;display:block}
.sec{padding:12px 10px}
.t{color:#c9a84c;font-weight:800;font-size:13px;margin:10px 0}
.cgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.cat img{width:100%;border-radius:12px;border:1.5px solid #c9a84c}
.pgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.prod{background:#fff;border-radius:12px;overflow:hidden}
.prod img{width:100%;display:block}
.contact{text-align:center;padding:18px 10px}
.contact h3{color:#c9a84c}
.nav{position:fixed;bottom:0;left:0;right:0;background:#080808;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0 12px;border-radius:18px 18px 0 0}
.nav div{color:#777;font-size:10px;text-align:center;flex:1}
.detail{display:none;min-height:100vh;background:#050505}
.detail.on{display:block}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:800;margin-top:10px;display:block;text-align:center;text-decoration:none}
.bw{background:#25D366;color:#fff}
.bf{background:#1877F2;color:#fff}
</style>
</head>
<body>
<div id="home">
<div class="hero"><img src="banner_linas_exact.jpg"></div>
<div class="sec">
<div class="t">CATÉGORIES</div>
<div class="cgrid">
<div class="cat" onclick="openD('parfums')"><img src="cat_parfum.jpg"></div>
<div class="cat" onclick="openD('perso')"><img src="cat_perso.jpg"></div>
<div class="cat" onclick="openD('accessoires')"><img src="cat_sac.jpg"></div>
<div class="cat" onclick="openD('coiffure')"><img src="cat_coiffure.jpg"></div>
<div class="cat" onclick="openD('tshirt')"><img src="cat_tshirt.jpg"></div>
<div class="cat" onclick="openD('perruque')"><img src="cat_perruque.jpg"></div>
</div>
<div class="t">NOS PRODUITS</div>
<div class="pgrid">
<div class="prod" onclick="openD('parfums')"><img src="produit_badlad.jpg"></div>
<div class="prod" onclick="openD('accessoires')"><img src="produit_sac.jpg"></div>
<div class="prod" onclick="openD('tshirt')"><img src="produit_lacoste.jpg"></div>
<div class="prod" onclick="openD('perruque')"><img src="produit_perruque.jpg"></div>
</div>
</div>
<div class="contact"><h3>CONTACTEZ-NOUS</h3><p>06-34-96-20 • linashouse.business@gmail.com</p></div>
</div>
<script>
function openD(id){document.getElementById('home').style.display='none';document.querySelectorAll('.detail').forEach(d=>d.classList.remove('on'));document.getElementById(id).classList.add('on');window.scrollTo(0,0);}
function goH(){document.getElementById('home').style.display='block';document.querySelectorAll('.detail').forEach(d=>d.classList.remove('on'));window.scrollTo(0,0);}
</script>
</body>
</html>
